<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Passwords</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* `hidden` has to actually hide. The attribute is display:none in the
     browser's own stylesheet, which any author rule setting display
     beats -- and half the rows on this page are display:flex, so the
     lock screen came up with the search box and the tag filter still
     sitting over it. */
  [hidden] { display: none !important; }
  body {
    background: #000000;
    color: #cdd6f4;
    font-family: "JetBrainsMono Nerd Font", "Cascadia Mono", "Consolas", "Inter", sans-serif;
    font-size: 13px;
    padding: 34px 0 60px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  h1 { font-size: 22px; font-weight: 600; }
  .grow { flex: 1; }
  input, select, textarea, button {
    font: inherit;
    border-radius: 0;
    color: #cdd6f4;
    background: #0a0a0d;
    border: 1px solid rgba(108, 112, 134, 0.4);
    padding: 7px 10px;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: rgba(205, 214, 244, 0.7);
  }
  textarea { resize: vertical; min-height: 90px; width: 100%; }
  button { cursor: pointer; background: #0a0a0d; }
  button:hover { border-color: rgba(205, 214, 244, 0.7); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button:disabled:hover { border-color: rgba(205, 214, 244, 0.18); }
  button.primary { border-color: rgba(166, 227, 161, 0.5); color: #a6e3a1; }
  button.primary:hover { background: rgba(166, 227, 161, 0.12); }
  button.danger { border-color: rgba(243, 139, 168, 0.45); color: #f38ba8; }
  button.danger:hover { background: rgba(243, 139, 168, 0.14); }
  button.flat { border-color: transparent; background: transparent; padding: 4px 7px; }
  button.flat:hover { border-color: rgba(108, 112, 134, 0.5); }
  #q { width: 100%; }
  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .chip {
    border: 1px solid rgba(108, 112, 134, 0.4);
    background: #0a0a0d;
    color: #6c7086;
    padding: 5px 11px;
    cursor: pointer;
    font-size: 12px;
    white-space: nowrap;
  }
  .chip:hover { color: #cdd6f4; border-color: rgba(205, 214, 244, 0.5); }
  .chip.on { color: #000000; background: #cdd6f4; border-color: #cdd6f4; }
  .chip .n { opacity: .6; margin-left: 6px; }
  .health { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .hchip {
    border: 1px solid rgba(108, 112, 134, 0.35);
    padding: 7px 12px;
    font-size: 12px;
    cursor: pointer;
    background: #0a0a0d;
  }
  .hchip b { font-size: 15px; margin-right: 7px; }
  .hchip.reused { color: #fab387; border-color: rgba(250, 179, 135, 0.4); }
  .hchip.weak { color: #f38ba8; border-color: rgba(243, 139, 168, 0.4); }
  .hchip.old { color: #f9e2af; border-color: rgba(249, 226, 175, 0.4); }
  .hchip.on { background: rgba(205, 214, 244, 0.1); }
  .hchip.good { color: #a6e3a1; border-color: rgba(166, 227, 161, 0.4); cursor: default; }
  .cols { display: flex; gap: 18px; align-items: flex-start; }
  #list { flex: 0 0 380px; }
  #detail { flex: 1; min-width: 0; position: sticky; top: 20px; }
  @media (max-width: 900px) {
    .cols { display: block; }
    #list { width: auto; }
    #detail { position: static; margin-top: 18px; }
  }
  .row {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 9px 11px;
    border: 1px solid transparent;
    border-left: 2px solid transparent;
    background: rgba(13, 13, 18, 0.6);
    margin-bottom: 3px;
    cursor: pointer;
  }
  .row:hover { background: #0d0d12; border-color: rgba(108, 112, 134, 0.4); }
  .row.sel { background: #0d0d12; border-left-color: #cdd6f4; }
  .row .kind {
    font-size: 9px;
    letter-spacing: 1px;
    color: #6c7086;
    border: 1px solid rgba(108, 112, 134, 0.4);
    padding: 2px 4px;
    flex-shrink: 0;
    width: 42px;
    text-align: center;
  }
  .row .txt { flex: 1; min-width: 0; }
  .row .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .s { color: #6c7086; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .star { color: #f9e2af; flex-shrink: 0; }
  .badges { display: flex; gap: 3px; flex-shrink: 0; }
  .badge { font-size: 9px; border: 1px solid; padding: 1px 4px; }
  .badge.reused { color: #fab387; border-color: rgba(250, 179, 135, 0.5); }
  .badge.weak { color: #f38ba8; border-color: rgba(243, 139, 168, 0.5); }
  .badge.old { color: #f9e2af; border-color: rgba(249, 226, 175, 0.5); }
  .panel { border: 1px solid rgba(108, 112, 134, 0.4); background: #060608; padding: 18px; }
  .panel h2 { font-size: 16px; font-weight: 600; margin-bottom: 3px; }
  .panel .sub { color: #6c7086; font-size: 12px; margin-bottom: 16px; }
  .field { display: flex; gap: 10px; align-items: baseline; padding: 8px 0; border-top: 1px solid rgba(108, 112, 134, 0.18); }
  .field > label { color: #6c7086; font-size: 11px; flex: 0 0 120px; text-transform: uppercase; letter-spacing: .6px; }
  .field .val { flex: 1; min-width: 0; word-break: break-word; }
  .field .val.mono { font-family: monospace; letter-spacing: 1px; }
  .field .acts { display: flex; gap: 4px; flex-shrink: 0; }
  .field input, .field select, .field textarea { flex: 1; min-width: 0; }
  .muted { color: #6c7086; }
  .totp { display: flex; align-items: center; gap: 12px; }
  .totp .code { font-family: monospace; font-size: 26px; letter-spacing: 4px; color: #a6e3a1; }
  .ring { width: 26px; height: 26px; flex-shrink: 0; }
  .ring circle { fill: none; stroke-width: 3; }
  .ring .bg { stroke: rgba(108, 112, 134, 0.35); }
  .ring .fg { stroke: #a6e3a1; transition: stroke-dashoffset .95s linear; }
  .bar { height: 4px; background: rgba(108, 112, 134, 0.25); margin-top: 6px; }
  .bar > div { height: 100%; }
  .foot { display: flex; gap: 8px; margin-top: 22px; flex-wrap: wrap; align-items: center; }
  .note { color: #6c7086; font-size: 12px; margin-top: 10px; line-height: 1.5; }
  .warn { color: #f9e2af; }
  .storebar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .storebar b { font-weight: 600; }
  #never { margin-top: 26px; }
  #never h3 { font-size: 12px; color: #6c7086; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  #never .n { display: flex; gap: 8px; align-items: center; padding: 5px 0; }
  .gen { border: 1px solid rgba(108, 112, 134, 0.4); padding: 12px; margin-top: 8px; background: #0a0a0d; }
  .gen .out { font-family: monospace; font-size: 15px; word-break: break-all; padding: 8px 0; color: #a6e3a1; }
  .gen .opts { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; font-size: 12px; color: #6c7086; }
  .gen label { display: flex; gap: 5px; align-items: center; cursor: pointer; }
  input[type=range] { padding: 0; background: transparent; border: none; }
  input[type=checkbox] { accent-color: #cdd6f4; }
  #toast {
    position: fixed;
    left: 50%;
    bottom: 26px;
    transform: translateX(-50%);
    background: #0d0d12;
    border: 1px solid rgba(108, 112, 134, 0.5);
    padding: 9px 16px;
    font-size: 12px;
    max-width: 80vw;
  }
  #toast[hidden] { display: none; }
  .empty { color: #6c7086; text-align: center; padding: 40px 10px; }
  /* The locked screen. Deliberately the whole page and not a banner
     over a greyed-out list: there is no list to grey out. */
  #locked { text-align: center; padding: 60px 20px; }
  #locked .glyph { font-size: 34px; line-height: 1; }
  #locked b { display: block; color: #cdd6f4; font-size: 17px;
              margin: 14px 0 6px; }
  #locked p { color: #6c7086; font-size: 13px; margin: 0 auto 18px;
              max-width: 380px; line-height: 1.5; }
  #locked[hidden] { display: none; }
  .empty b { display: block; color: #cdd6f4; font-size: 15px; margin-bottom: 6px; }
  /* A selection and a keyboard focus come out of the palette like
     everything else. Left alone they are the engine's own idea of a
     highlight — a blue that belongs to no theme in here, and on a
     couple of them a ring that cannot be seen at all. */
  ::selection { background: #cdd6f4; color: #000000; }
  :focus-visible { outline: 2px solid #cdd6f4; outline-offset: 2px; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1 id="t_title">Passwords</h1>
      <span class="muted" id="count"></span>
      <span class="grow"></span>
      <button id="newbtn" class="primary">New</button>
    </header>

    <div class="toolbar">
      <input id="q" placeholder="Search everything…" autocomplete="off">
      <select id="sort">
        <option value="name">Name</option>
        <option value="used">Recently used</option>
        <option value="changed">Recently changed</option>
      </select>
      <select id="tagsel"><option value="">All tags</option></select>
    </div>

    <div id="locked" hidden></div>

    <div id="store"></div>
    <div class="chips" id="kinds"></div>
    <div class="health" id="healthbar"></div>

    <div class="cols">
      <div id="list"></div>
      <div id="detail"></div>
    </div>

    <div id="never"></div>

    <div class="foot">
      <button id="importbtn">Import…</button>
      <button id="exportbtn" class="danger">Export…</button>
      <span class="grow"></span>
      <span class="muted" id="where"></span>
    </div>
  </div>
  <div id="toast" hidden></div>

<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script>
// The browser puts this run's key in our URL. Every slot that can see
// or change a secret wants it, and a website never learns it — so a
// site that somehow got hold of this channel still reaches nothing.
const KEY = new URLSearchParams(location.search).get("k") || "";
let bridge = null;
let VAULT = {items: [], never: [], tags: [], health: {flags: {}, totals: {}},
             backend: ""};
let sel = null;        // selected item id
let editing = null;    // draft object while the editor is open
let escDraft = null;   // the draft an Esc put aside, see __paneEsc
// A redraw rebuilds every input in the editor from `editing`, and the
// inputs are not read back until Save — so a redraw arriving while he
// is typing throws away everything since the editor opened. Anything
// that would redraw while it is open waits here instead.
let pendingRefresh = false;
let totpTimer = null;
// A store that has to go and fetch a secret (1Password shells out to
// `op`) answers with a ticket instead of a value, so the browser's own
// thread is never blocked waiting on it. The real answer arrives on
// the vaultSecret signal and is handed to whoever asked.
const waiting = {};
function answered(reply, then) {
  let d = {};
  try { d = JSON.parse(reply) || {}; } catch (e) {}
  if (d.pending) { waiting[d.pending] = then; return true; }
  then(d);
  return false;
}
const KINDS = ["login", "note", "card", "identity"];
const S = {
  passwords: "Passwords", pwManage: "Password manager",
  pwSearchPh: "Search everything…", pwNew: "New", pwNewLogin: "Login",
  pwNewNote: "Secure note", pwNewCard: "Payment card",
  pwNewIdentity: "Identity", pwAll: "All", pwLogins: "Logins",
  pwNotes: "Notes", pwCards: "Cards", pwIdentities: "Identities",
  pwFavs: "Favourites", pwFav: "Favourite", pwSortName: "Name",
  pwSortUsed: "Recently used", pwSortChanged: "Recently changed",
  pwNoMatch: "Nothing matches that.", pwTitle: "Name", pwNote: "Note",
  pwTags: "Tags", pwTagsPh: "work, banking", pwAllTags: "All tags",
  pwDelete: "Delete", pwDeleteAsk: "Delete “{}” for good?",
  pwCancel: "Cancel", pwReveal: "Reveal", pwRevealAsk: "Show this on screen?",
  pwCopyUser: "Copy username", pwCopyPass: "Copy password",
  pwCopyCode: "Copy code", pwOpenSite: "Open site", pwGen: "Generate",
  pwGenTitle: "Password generator", pwGenLength: "Length",
  pwGenSymbols: "Symbols", pwGenDigits: "Digits", pwGenUpper: "Capitals",
  pwGenAmbig: "Allow lookalikes (l 1 I O 0)", pwGenUse: "Use this one",
  pwGenAgain: "Again", pw2fa: "Two-factor code",
  pw2faSecret: "Two-factor secret",
  pw2faPh: "otpauth://… or the base32 secret",
  pw2faBad: "That is not a usable two-factor secret.",
  pw2faOk: "Two-factor secret accepted ✓",
  pw2faNone: "No two-factor code stored.", pwHealth: "Health",
  pwReused: "Reused", pwWeak: "Weak", pwOld: "Never changed",
  pwHealthy: "Nothing to fix ✓",
  pwReusedHint: "Used on more than one site — one break-in opens them all.",
  pwWeakHint: "Short or too simple to hold up.",
  pwOldHint: "Unchanged for over a year.", pwStrength: "Strength",
  pwSiteDead: "Not a host name, so this login never fills anywhere.",
  pwStrengthWeak: "weak", pwStrengthFair: "fair", pwStrengthStrong: "strong",
  pwImport: "Import…", pwExport: "Export…",
  pwImportDone: "Imported: {a} added, {b} updated, {c} skipped.",
  pwImportFailed: "Nothing could be read from that file.",
  pwExportDone: "Written to {}", pwNeverEmpty: "Nothing on the never-save list.",
  pwNever: "Never saved for", pwSite: "Site", pwUser: "Username",
  pwPass: "Password", pwHide: "Hide", pwCopy: "Copy",
  pwCopied: "Copied ✓", pwEdit: "Edit", pwSaveBtn: "Save",
  pwCardNumber: "Card number", pwCardHolder: "Name on card",
  pwCardExpiry: "Expires", pwCardCvv: "Security code",
  pwCardBrand: "Card type", pwIdName: "Full name", pwIdEmail: "Email",
  pwIdPhone: "Phone", pwIdStreet: "Street", pwIdCity: "City",
  pwIdZip: "Postcode", pwIdCountry: "Country",
  pwNoteBody: "Note contents", pwUnnamed: "Untitled", pwChanged: "Changed",
  pwCreated: "Added", pwUsed: "Last used", pwNeverUsed: "never",
  pwLeaveBlank: "Leave blank to keep the password already saved",
  pwCount: "{} items", pwSaved: "Saved ✓", pwEmptyTitle: "Nothing saved yet",
  pwEmptyBody: "Log in somewhere and the browser offers to remember it — or add something here yourself.",
  pwOpBadToken: "The token file cannot be read — paste the token again.",
  pwStoreChecking: "Reaching for {}…",
  pwSaveFailed: "Not saved — the store would not take it.",
  pwDeleteFailed: "Not deleted — it is still in the store.",
  pwFetchFailed: "Could not get that from the store.",
  pwNothingThere: "Nothing is stored in that field.",
  pwImporting: "Importing…",
  pwExportNA: "Only the vault on this computer can be exported. 1Password does not hand the passwords over, so the file would list every login with an empty password column — something that looks like a backup and is not one.",
  pwDenied: "This page is out of date",
  pwDeniedBody: "Open the password manager again from the menu. The key this page is holding belongs to an earlier run of the browser, so nothing was handed over.",
  pwHint: "", lang: undefined,
};
const filter = {kind: "", tag: "", fav: false, flag: "", q: "", sort: "name"};

// ---- little helpers ----
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}
function btn(label, cls, onclick, title) {
  const b = el("button", cls, label);
  if (title) b.title = title;
  b.onclick = onclick;
  return b;
}
function toast(text) {
  const t = document.getElementById("toast");
  t.textContent = text;
  t.hidden = false;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.hidden = true; }, 2600);
}
function fmtDate(ts) {
  if (!ts) return S.pwNeverUsed;
  return new Date(ts * 1000).toLocaleDateString(S.lang || [],
    {year: "numeric", month: "short", day: "numeric"});
}
function titleOf(it) {
  return it.title || it.host || it.fullname || it.cardholder || S.pwUnnamed;
}
function subtitleOf(it) {
  if (it.type === "login") return it.username || it.host || "";
  if (it.type === "card") return it.last4 ? "•••• " + it.last4 : "";
  if (it.type === "identity") return it.email || it.fullname || "";
  return (it.tags || []).join(", ");
}
function kindLabel(k) {
  return {login: "LOGIN", note: "NOTE", card: "CARD",
          identity: "ID"}[k] || k.toUpperCase();
}
function flagsOf(id) { return ((VAULT.health || {}).flags || {})[id] || []; }

// A confirm that stays inside the page: the button turns into the
// question and only the second, deliberate click goes through. No
// native dialog to mis-click past, and nothing is revealed on a
// stray tap.
function armed(button, question, run) {
  const original = button.textContent, cls = button.className;
  button.onclick = () => {
    button.textContent = question;
    button.className = cls + " danger";
    const cancel = setTimeout(reset, 4000);
    button.onclick = () => { clearTimeout(cancel); reset(); run(); };
    function reset() {
      button.textContent = original;
      button.className = cls;
      armed(button, question, run);
    }
  };
  return button;
}

// ---- data ----
function refresh(then) {
  if (!bridge) { render(); return; }
  bridge.getVault(KEY, (j) => {
    let d = null;
    try { d = JSON.parse(j); } catch (e) {}
    // "{}" is what a key from an earlier run of the browser gets
    // back. Nothing was handed over, so there is nothing to draw —
    // and render() used to throw on the missing health totals half
    // way through, leaving the whole page blank and silent.
    if (!d || !d.items) { renderDenied(); return; }
    pendingRefresh = false;
    // Locked is a state of the whole page, not a row of empty ones.
    // getVault hands back a shut vault rather than an empty one for
    // exactly this: "nothing saved yet" over a full vault is a thing
    // he could act on.
    if (d.locked) { VAULT = d; renderLocked(); if (then) then(); return; }
    VAULT = d;
    if (!VAULT.health) VAULT.health = {flags: {}, totals: {}};
    if (!VAULT.health.flags) VAULT.health.flags = {};
    if (!VAULT.never) VAULT.never = [];
    if (!VAULT.tags) VAULT.tags = [];
    render();
    if (then) then();
  });
}
// Everything the page draws lives inside .wrap; the lock screen
// replaces the working parts of it and leaves the heading alone, so
// it still looks like the password manager rather than an error.
const WORKING = ["kinds", "healthbar", "store", "never", "detail",
                 "list", "count"];
function hideWorking(hidden) {
  for (const id of WORKING) {
    const n = document.getElementById(id);
    if (n) { n.innerHTML = ""; n.hidden = hidden; }
  }
  for (const id of ["q", "sort", "tagsel", "newbtn", "importbtn",
                    "exportbtn"]) {
    const n = document.getElementById(id);
    if (n) n.disabled = hidden;
  }
  // The search box, the sort and the tag filter are not merely
  // unusable while the vault is shut, they are about a list that is
  // not there. A greyed-out "All tags" over a lock reads as a page
  // that failed to load rather than one that is doing its job.
  for (const sel of [".toolbar", ".foot", "#newbtn"]) {
    const n = document.querySelector(sel);
    if (n) n.hidden = hidden;
  }
  const where = document.getElementById("where");
  if (where && hidden) where.textContent = "";
}

function renderLocked() {
  editing = null;          // nothing half-typed survives a lock
  hideWorking(true);
  const box = document.getElementById("locked");
  box.hidden = false;
  box.innerHTML = "";
  box.appendChild(el("div", "glyph", "\u{1f512}"));
  box.appendChild(el("b", "", S.masterLockedTitle));
  box.appendChild(el("p", "", S.masterLockedBody));
  // The one button on a locked page, and it raises a window of the
  // browser's own -- the passphrase is never typed into this document.
  box.appendChild(btn(S.masterUnlockBtn, "primary", () => {
    if (!bridge || !bridge.unlockVault) return;
    bridge.unlockVault(() => refresh());
  }));
}

function renderDenied() {
  // Whatever is on screen, including the lock: this message has to be
  // readable, and hideWorking(true) would otherwise leave the box it
  // is written into hidden.
  hideWorking(false);
  document.getElementById("locked").hidden = true;
  for (const id of ["kinds", "healthbar", "store", "never", "detail", "list"])
    document.getElementById(id).innerHTML = "";
  document.getElementById("count").textContent = "";
  const box = el("div", "empty");
  box.appendChild(el("b", "", S.pwDenied));
  box.appendChild(document.createTextNode(S.pwDeniedBody));
  document.getElementById("list").appendChild(box);
}
function itemById(id) {
  return VAULT.items.find((i) => i.id === id) || null;
}
// Leaving the editor, by Save, Cancel or Esc: whatever was held back
// while it was open happens now.
function closeEditor() {
  editing = null;
  if (pendingRefresh) { pendingRefresh = false; refresh(); }
  else render();
}

// ---- filtering, sorting ----
function visible() {
  const words = filter.q.toLowerCase().split(/\s+/).filter(Boolean);
  let out = VAULT.items.filter((it) => {
    if (filter.kind && it.type !== filter.kind) return false;
    if (filter.tag && !(it.tags || []).includes(filter.tag)) return false;
    if (filter.fav && !it.fav) return false;
    if (filter.flag && !flagsOf(it.id).includes(filter.flag)) return false;
    if (!words.length) return true;
    // search across every field the browser sent us — which is every
    // field except the secrets themselves
    const blob = JSON.stringify(it).toLowerCase();
    return words.every((w) => blob.includes(w));
  });
  const by = filter.sort;
  out.sort((a, b) => {
    if (a.fav !== b.fav) return a.fav ? -1 : 1;
    if (by === "used") return (b.used || 0) - (a.used || 0);
    if (by === "changed") return (b.changed || 0) - (a.changed || 0);
    return titleOf(a).localeCompare(titleOf(b), S.lang || undefined,
                                    {sensitivity: "base"});
  });
  return out;
}

// ---- rendering ----
function renderStore() {
  const box = document.getElementById("store");
  box.innerHTML = "";
  const line = el("div", "storebar");
  line.appendChild(el("span", "muted", S.pwStore + ":"));
  line.appendChild(el("b", "", VAULT.providerLabel || VAULT.provider || ""));
  line.appendChild(btn("\u2026", "flat", () => {
    const open = document.getElementById("storepicker");
    if (open) { open.remove(); return; }
    bridge.vaultProviders(KEY, (reply) => answered(reply, (d) => {
      box.appendChild(renderPicker(d.providers || []));
    }));
  }));
  box.appendChild(line);
  // The notes go UNDER the line, never inside it: the store picker's
  // own "…" button sits at the end of it, and "Reaching for
  // 1Password… …" is not a sentence.
  if (VAULT.checking)
    box.appendChild(el("div", "note", S.pwStoreChecking.replace("{}",
      VAULT.checking === "1password" ? (S.pwStore1p || "1Password")
                                     : VAULT.checking)));
  if (VAULT.fellBack)
    box.appendChild(el("div", "note warn",
      S.pwFellBack.replace("{}", reasonText(VAULT.fellBack))));
  else if (VAULT.ok === false && !VAULT.checking)
    box.appendChild(el("div", "note warn", reasonText(VAULT.reason)));
}

function reasonText(reason) {
  // A vault this build cannot read is not "1Password would not answer";
  // it is the one message on this page that has to be unmistakable,
  // because the wrong move at this moment loses every password.
  if (reason === "vault-newer") return S.pwVaultNewer;
  if (reason === "op-missing" || reason === "no-op") return S.pwOpNoBinary;
  if (reason === "no-token") return S.pwOpNoToken;
  if (reason === "bad-token") return S.pwOpBadToken;
  if (reason === "checking") return "";
  if (reason === "timeout") return S.pwOpFailed.replace("{}", "timeout");
  return reason ? S.pwOpFailed.replace("{}", reason) : "";
}

function renderPicker(list) {
  const box = el("div", "panel");
  box.id = "storepicker";
  box.style.marginBottom = "12px";
  for (const p of list) {
    const row = el("div", "field");
    const txt = el("div", "val");
    txt.appendChild(el("div", "", p.label));
    const why = p.ok ? (p.active ? S.pwActive : "") : reasonText(p.reason);
    if (why) txt.appendChild(el("div", "note" + (p.ok ? "" : " warn"), why));
    row.appendChild(txt);
    const acts = el("div", "acts");
    if (p.name === "1password") {
      acts.appendChild(btn(S.pwSetToken, "flat", () => {
        bridge.setOpToken(KEY, (j) => {
          let d = {};
          try { d = JSON.parse(j); } catch (e) {}
          if (!d.cancelled)
            toast(d.hasToken ? S.pwTokenSet : S.pwOpNoToken);
          box.remove();
          refresh();
        });

    box.appendChild(row);

  box.appendChild(el("div", "note", S.pwStoreHint));
  return box;
}

function renderChips() {
  const box = document.getElementById("kinds");
  box.innerHTML = "";

  for (const it of VAULT.items) counts[it.type] = (counts[it.type] || 0) + 1;
  const add = (label, n, on, click) => {
    const c = el("div", "chip" + (on ? " on" : ""), label);

function renderHealth() {

// ---- detail ----
function field(label, valueNode, actions) {
  const f = el("div", "field");
  f.appendChild(el("label", "", label));
  if (typeof valueNode === "string")
    valueNode = el("div", "val", valueNode);
  valueNode.classList.add("val");
  f.appendChild(valueNode);
  if (actions && actions.length) {
    const a = el("div", "acts");
    actions.forEach((b) => b && a.appendChild(b));
    f.appendChild(a);
  }
  return f;
}

// Three answers, never two: it was copied, there was nothing in the
// field, or the store would not hand it over. Only the first of those
// is "Copied ✓" — the other two used to share a dash with it.
function copyToast(d) {
  toast(d.ok ? S.pwCopied : d.failed ? S.pwFetchFailed : S.pwNothingThere);
}

function secretField(it, key, label) {
  // Shown as dots until he asks. Reveal is a two-step button (see
  // `armed`) and the value is fetched only at that moment — it is
  // never sitting in the page waiting to be read.
  const val = el("div", "val mono", "••••••••••");
  const reveal = btn(S.pwReveal, "flat", null);
  function ask() {
    reveal.textContent = S.pwFetching;
    bridge.revealField(KEY, it.id, key, (reply) => answered(reply, (d) => {
      if (!d.ok) {
        // a fetch that failed is not an account with no password on
        // it, and a dash in this box says exactly that
        val.textContent = S.pwFetchFailed;
        val.className = "val warn";
        reveal.textContent = S.pwReveal;
        armed(reveal, S.pwRevealAsk, ask);
        return;
      }
      val.textContent = d.value || S.pwNothingThere;
      val.className = d.value ? "val mono" : "val muted";
      reveal.textContent = S.pwHide;
      reveal.onclick = () => { val.textContent = "••••••••••"; render(); };
    }));
  }
  armed(reveal, S.pwRevealAsk, ask);
  const copy = btn(S.pwCopy, "flat", () => {
    bridge.copyField(KEY, it.id, key, (reply) => answered(reply, copyToast));
  });
  return field(label, val, [reveal, copy]);
}

function plainField(label, value, item, key) {
  if (!value) return null;
  const acts = [];
  if (item && key)
    acts.push(btn(S.pwCopy, "flat", () => {
      // the reply is a JSON string, and every non-empty string is
      // truthy: this used to toast "Copied ✓" over an empty clipboard,
      // and to fire on the pending ticket before anything was copied
      bridge.copyField(KEY, item.id, key,
                       (reply) => answered(reply, copyToast));
    }));
  return field(label, value, acts);
}

function strengthBar(bits) {
  const wrap = el("div", "val");
  const label = bits < 50 ? S.pwStrengthWeak
              : bits < 80 ? S.pwStrengthFair : S.pwStrengthStrong;
  const colour = bits < 50 ? "var(--red, #f38ba8)"
               : bits < 80 ? "var(--yellow, #f9e2af)"
                           : "var(--green, #a6e3a1)";
  wrap.appendChild(el("span", "", label));
  const bar = el("div", "bar");
  const fill = el("div");
  fill.style.width = Math.max(4, Math.min(100, bits)) + "%";
  fill.style.background = colour;
  bar.appendChild(fill);
  wrap.appendChild(bar);
  return wrap;
}

function totpBlock(it) {
  const wrap = el("div", "totp");
  const code = el("div", "code", "······");
  const ring = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  ring.setAttribute("class", "ring");
  ring.setAttribute("viewBox", "0 0 32 32");
  const mk = (cls) => {
    const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    c.setAttribute("class", cls);
    c.setAttribute("cx", "16"); c.setAttribute("cy", "16");
    c.setAttribute("r", "13");
    return c;
  };
  const bg = mk("bg"), fg = mk("fg");
  const circumference = 2 * Math.PI * 13;
  fg.setAttribute("stroke-dasharray", circumference);
  fg.setAttribute("transform", "rotate(-90 16 16)");
  ring.append(bg, fg);
  wrap.append(code, ring);
  const copy = btn(S.pwCopyCode, "flat", () => {
    // The seed is what is stored; what he wants on the clipboard is
    // the code showing right now. copyField(…, "totp") would put the
    // seed there instead — a secret good for years in place of one
    // good for thirty seconds — and, being asynchronous, would land
    // after anything this page did itself and win.
    bridge.copyTotpCode(KEY, it.id, (reply) => answered(reply, copyToast));
  });
  wrap.appendChild(copy);
  function tick() {
    if (!bridge) return;
    bridge.totpFor(KEY, it.id, (reply) => answered(reply, (d) => {
      if (d.error || !d.code) {
        const row = wrap.closest(".field");
        if (row && row.dataset.maybe) {   // this store had no code after all
          clearInterval(totpTimer);
          const gone = field(S.pw2fa, el("div", "val muted", S.pw2faNone), []);
          row.replaceWith(gone);
          return;
        }
        code.textContent = "??????";
        return;
      }
      code.textContent = d.code.replace(/(.{3})(?=.)/g, "$1 ");
      const frac = d.left / d.period;
      fg.setAttribute("stroke-dashoffset",
                      (circumference * (1 - frac)).toFixed(2));
      ring.setAttribute("title", Math.ceil(d.left) + " s");
    }));
  }
  tick();
  clearInterval(totpTimer);
  totpTimer = setInterval(tick, 1000);
  return wrap;
}

// Everything this page copies is copied by the browser, not by the
// page: web content gets no clipboard permission here, and the hidden
// textarea trick does not work either — document.execCommand("copy")
// returns false in this engine and leaves the clipboard alone, while
// happily letting the page announce "Copied ✓" over it.

const FIELDS = {
  login: [["title", "pwTitle"], ["host", "pwSite"], ["username", "pwUser"],
          ["password", "pwPass", "secret"], ["totp", "pw2faSecret", "secret"],
          ["note", "pwNote", "area"]],
  note: [["title", "pwTitle"], ["body", "pwNoteBody", "secretarea"]],
  card: [["title", "pwTitle"], ["cardholder", "pwCardHolder"],
         ["number", "pwCardNumber", "secret"],
         ["expiry", "pwCardExpiry"], ["cvv", "pwCardCvv", "secret"],
         ["brand", "pwCardBrand"], ["note", "pwNote", "area"]],
  identity: [["title", "pwTitle"], ["fullname", "pwIdName"],
             ["email", "pwIdEmail"], ["phone", "pwIdPhone"],
             ["street", "pwIdStreet"], ["city", "pwIdCity"],
             ["zip", "pwIdZip"], ["country", "pwIdCountry"],
             ["note", "pwNote", "area"]],
};

function renderDetail() {
  const box = document.getElementById("detail");
  box.innerHTML = "";
  clearInterval(totpTimer);
  if (editing) { box.appendChild(renderEditor()); return; }
  const it = sel ? itemById(sel) : null;
  if (!it) {
    if (!VAULT.items.length) return;
    const hint = el("div", "panel");
    hint.appendChild(el("div", "sub", S.pwPickHint || ""));
    box.appendChild(hint);
    return;
  }
  const panel = el("div", "panel");
  const head = el("div", "field");
  head.style.borderTop = "none";
  head.style.paddingTop = "0";
  const h = el("div");
  h.style.flex = "1";
  h.appendChild(el("h2", "", titleOf(it)));
  h.appendChild(el("div", "sub", kindLabel(it.type).toLowerCase()
    + (it.host ? " · " + it.host : "")));
  head.appendChild(h);
  const acts = el("div", "acts");
  acts.appendChild(btn(it.fav ? "★" : "☆", "flat", () => {
    bridge.toggleFavourite(KEY, it.id,
                           (reply) => answered(reply, () => refresh()));
  }, S.pwFav));
  // an item type this build has no form for belongs to a newer vault:
  // it is shown and it is kept, but it is not edited from here
  if (FIELDS[it.type]) {
    const editBtn = btn(S.pwEdit, "", () => {
      editing = (escDraft && escDraft.id === it.id)
                ? escDraft : Object.assign({}, it);
      escDraft = null;
      render();
    });
    editBtn.id = "editbtn";
    acts.appendChild(editBtn);
  }
  const del = btn(S.pwDelete, "flat", null);
  armed(del, S.pwDeleteAsk.replace("{}", titleOf(it)), () => {
    bridge.deleteItem(KEY, it.id, (reply) => answered(reply, (d) => {
      if (!d.ok) { toast(S.pwDeleteFailed); return; }
      sel = null;
      refresh();
    }));
  });
  acts.appendChild(del);
  head.appendChild(acts);
  panel.appendChild(head);

  for (const [key, label, sort] of FIELDS[it.type] || []) {
    if (key === "totp") continue;
    if (sort === "secret" || sort === "secretarea") {
      const flag = "has" + key.charAt(0).toUpperCase() + key.slice(1);
      if (it[flag]) panel.appendChild(secretField(it, key, S[label]));
      continue;
    }
    const f = plainField(S[label], it[key], it,
                         key === "username" ? "username" : null);
    if (f) panel.appendChild(f);
    // A Site that is not a host name matches no page, so this login
    // never fills anywhere. Nothing else in the browser would ever
    // mention it: it simply does nothing, for ever.
    if (key === "host" && it.dead) {
      const line = el("div", "field");
      line.appendChild(el("label", "", ""));
      const v = el("div", "val");
      const t = el("div", "", S.pwSiteDead || "");
      t.style.color = "var(--yellow, #f9e2af)";
      t.id = "deadsite";
      v.appendChild(t);
      line.appendChild(v);
      panel.appendChild(line);
    }
  }
  if (it.type === "login") {
    // no strength row for a store that does not hand the password
    // over: a judgement on something we cannot see would be a lie
    if (it.strength !== undefined)
      panel.appendChild(field(S.pwStrength, strengthBar(it.strength), []));
    if (it.hasTotp || it.totpUnknown) {
      const row = field(S.pw2fa, totpBlock(it), []);
      panel.appendChild(row);
      // a store that cannot say in advance whether there is a code
      // gets the row removed again when none arrives
      if (it.totpUnknown) row.dataset.maybe = "1";
    } else {
      panel.appendChild(field(S.pw2fa, el("div", "val muted", S.pw2faNone),
                              []));
    }
  }
  const fl = flagsOf(it.id);
  if (fl.length) {
    const box2 = el("div", "val");
    for (const f of fl) {
      const line = el("div", "",
        ({reused: S.pwReusedHint, weak: S.pwWeakHint,
          old: S.pwOldHint})[f] || f);
      line.style.color = ({reused: "var(--peach, #fab387)",
                           weak: "var(--red, #f38ba8)",
                           old: "var(--yellow, #f9e2af)"})[f];
      box2.appendChild(line);
    }
    panel.appendChild(field(S.pwHealth, box2, []));
  }
  if ((it.tags || []).length)
    panel.appendChild(field(S.pwTags, (it.tags || []).join(", "), []));
  panel.appendChild(field(S.pwUsed, fmtDate(it.used), []));
  panel.appendChild(field(S.pwChanged, fmtDate(it.changed), []));
  if (it.type === "login" && it.host) {
    const open = btn(S.pwOpenSite, "flat", () => {
      location.href = (it.scheme || "https") + "://" + it.host + "/";
    });
    const f = el("div", "field");
    f.appendChild(el("label", "", ""));
    const v = el("div", "val");
    v.appendChild(open);
    f.appendChild(v);
    panel.appendChild(f);
  }
  box.appendChild(panel);
}

// ---- editor ----
function renderEditor() {
  const panel = el("div", "panel");
  const isNew = !editing.id;
  panel.appendChild(el("h2", "", isNew
    ? ({login: S.pwNewLogin, note: S.pwNewNote, card: S.pwNewCard,
        identity: S.pwNewIdentity})[editing.type]
    : titleOf(editing)));
  panel.appendChild(el("div", "sub", kindLabel(editing.type).toLowerCase()));
  const inputs = {};
  for (const [key, label, sort] of FIELDS[editing.type] || []) {
    let node;
    if (sort === "area" || sort === "secretarea") {
      node = el("textarea");
      node.value = editing[key] || "";
    } else {
      node = el("input");
      node.type = (sort === "secret" && key !== "totp") ? "password" : "text";
      node.value = editing[key] || "";
      if (key === "host") node.placeholder = "example.com";
      if (key === "totp") node.placeholder = S.pw2faPh;
    }
    inputs[key] = node;
    // addEventListener, not oninput: the two-factor box sets its own
    // oninput below and both have to run
    node.addEventListener("input", () => { editing[key] = node.value; });
    const acts = [];
    if (key === "password") {
      const g = btn(S.pwGen, "flat", () => toggleGenerator(panel, node));
      g.id = "genbtn";
      acts.push(g);
    }
    if ((sort === "secret" || sort === "secretarea") && !node.placeholder) {
      const flag = "has" + key.charAt(0).toUpperCase() + key.slice(1);
      if (!isNew && editing[flag]) node.placeholder = S.pwLeaveBlank;
    }
    panel.appendChild(field(S[label], node, acts));
    if (key === "totp") {
      const hint = el("div", "note");
      panel.appendChild(hint);
      node.oninput = () => {
        const text = node.value.trim();
        if (!text) { hint.textContent = ""; hint.className = "note"; return; }
        bridge.checkTotpSecret(KEY, text, (j) => {
          let d = {};
          try { d = JSON.parse(j); } catch (e) {}
          hint.textContent = d.ok
            ? S.pw2faOk + (d.issuer ? " — " + d.issuer : "")
            : S.pw2faBad;
          hint.className = "note" + (d.ok ? "" : " warn");
        });
      };
    }
  }
  const tags = el("input");
  tags.value = (editing.tags || []).join(", ");
  tags.placeholder = S.pwTagsPh;
  tags.addEventListener("input", () => {
    editing.tags = tags.value.split(",").map((t) => t.trim()).filter(Boolean);
  });
  panel.appendChild(field(S.pwTags, tags, []));

  const bar = el("div", "foot");
  bar.appendChild(btn(S.pwSaveBtn, "primary", () => {
    const payload = {type: editing.type};
    if (editing.id) payload.id = editing.id;
    for (const [key, , sort] of FIELDS[editing.type] || []) {
      const value = inputs[key].value;
      const secret = (sort === "secret" || sort === "secretarea");
      // a blank secret box on an existing item means "leave it alone",
      // so the field is simply not sent
      if (secret && !value && editing.id) continue;
      payload[key] = value;
    }
    payload.tags = tags.value.split(",").map((t) => t.trim()).filter(Boolean);
    bridge.saveItem(KEY, JSON.stringify(payload), (reply) =>
      answered(reply, (d) => {
        // the store gets to say whether it took it; "Saved ✓" over a
        // write 1Password refused is the worst kind of lie this page
        // could tell
        if (!d.ok) { toast(S.pwSaveFailed); return; }
        if (d.id) sel = d.id;
        editing = null;
        pendingRefresh = false;
        refresh(() => toast(S.pwSaved));
      }));
  }));
  bar.appendChild(btn(S.pwCancel, "", closeEditor));
  panel.appendChild(bar);
  return panel;
}

// ---- generator ----
function toggleGenerator(panel, target) {
  const existing = panel.querySelector(".gen");
  if (existing) { existing.remove(); return; }
  const box = el("div", "gen");
  const out = el("div", "out", "…");
  const opts = el("div", "opts");
  const len = el("input");
  len.type = "range";
  len.min = "8"; len.max = "64"; len.value = "20";
  const lenLabel = el("span", "", S.pwGenLength + " 20");
  const toggles = {};
  const mk = (key, label, on) => {
    const wrap = el("label");
    const cb = el("input");
    cb.type = "checkbox";
    cb.checked = on;
    cb.onchange = draw;
    toggles[key] = cb;
    wrap.append(cb, document.createTextNode(label));
    return wrap;
  };
  opts.append(lenLabel, len,
              mk("upper", S.pwGenUpper, true),
              mk("digits", S.pwGenDigits, true),
              mk("symbols", S.pwGenSymbols, true),
              mk("ambiguous", S.pwGenAmbig, false));
  function draw() {
    lenLabel.textContent = S.pwGenLength + " " + len.value;
    bridge.generatePassword(KEY, parseInt(len.value, 10),
      toggles.symbols.checked, toggles.digits.checked,
      toggles.upper.checked, toggles.ambiguous.checked,
      (p) => { out.textContent = p; });
  }
  len.oninput = draw;
  const bar = el("div", "foot");
  bar.appendChild(btn(S.pwGenUse, "primary", () => {
    target.value = out.textContent;
    target.type = "text";
    box.remove();
  }));
  bar.appendChild(btn(S.pwGenAgain, "", draw));
  bar.appendChild(btn(S.pwCopy, "flat", () => {
    bridge.copyGenerated(KEY, (reply) => {
      let d = {};
      try { d = JSON.parse(reply) || {}; } catch (e) {}
      toast(d.ok ? S.pwCopied : S.pwFetchFailed);
    });
  }));
  box.append(el("div", "sub", S.pwGenTitle), out, opts, bar);
  target.closest(".field").after(box);
  draw();
}

function renderTags() {
  const sel2 = document.getElementById("tagsel");
  const was = filter.tag;
  sel2.innerHTML = "";
  const all = el("option", "", S.pwAllTags);
  all.value = "";
  sel2.appendChild(all);
  for (const t of VAULT.tags || []) {
    const o = el("option", "", t);
    o.value = t;
    sel2.appendChild(o);
  }
  sel2.value = was;
}

function render() {
  // A store that never handed the passwords over cannot be exported to
  // anything worth having: the file would list every login with an
  // empty password column and look exactly like a backup.
  const exportBtn = document.getElementById("exportbtn");
  exportBtn.disabled = VAULT.eager === false;
  exportBtn.title = exportBtn.disabled ? (S.pwExportNA || "") : "";
  const lockbox = document.getElementById("locked");
  if (lockbox && !lockbox.hidden) { lockbox.hidden = true; hideWorking(false); }
  renderStore();
  renderChips();
  renderHealth();
  renderTags();
  renderList();
  renderDetail();
  renderNever();
  // this line describes how the FILE vault keeps things, so it is
  // only shown when that is the store in use
  document.getElementById("where").textContent =
    VAULT.eager === false ? "" : (S.pwHint || "");
}

// ---- new-item menu ----
document.getElementById("newbtn").onclick = (ev) => {
  const old = document.getElementById("newmenu");
  if (old) { old.remove(); return; }
  const menu = el("div", "panel");
  menu.id = "newmenu";
  menu.style.position = "absolute";
  menu.style.zIndex = "20";
  menu.style.padding = "6px";
  const rect = ev.target.getBoundingClientRect();
  menu.style.top = (rect.bottom + window.scrollY + 4) + "px";
  menu.style.right = "20px";
  const names = {login: S.pwNewLogin, note: S.pwNewNote, card: S.pwNewCard,
                 identity: S.pwNewIdentity};
  for (const k of KINDS) {
    const b = btn(names[k], "flat", () => {
      editing = (escDraft && !escDraft.id && escDraft.type === k)
                ? escDraft : {type: k, tags: []};
      escDraft = null;
      sel = null;
      menu.remove();
      render();
    });
    b.style.display = "block";
    b.style.width = "100%";
    b.style.textAlign = "left";
    menu.appendChild(b);
  }
  document.body.appendChild(menu);
};

document.getElementById("q").oninput = (e) => {
  filter.q = e.target.value;
  renderList();
};
document.getElementById("sort").onchange = (e) => {
  filter.sort = e.target.value;
  renderList();
};
document.getElementById("tagsel").onchange = (e) => {
  filter.tag = e.target.value;
  renderList();
};
document.getElementById("importbtn").onclick = () => {
  bridge.importPasswords(KEY, (reply) => {
    // a big export is read and written on a worker thread, so the
    // answer is a ticket and the file is still being worked through
    const pending = answered(reply, (d) => {
      if (d.cancelled) return;
      if (d.error || (!d.added && !d.updated && !d.skipped)) {
        toast(S.pwImportFailed);
      } else {
        toast(S.pwImportDone.replace("{a}", d.added)
          .replace("{b}", d.updated).replace("{c}", d.skipped));
      }
      refresh();
    });
    if (pending) toast(S.pwImporting);
  });
};
document.getElementById("exportbtn").onclick = () => {
  bridge.exportPasswords(KEY, (j) => {
    let d = {};
    try { d = JSON.parse(j); } catch (e) {}
    if (d.unavailable) { toast(S.pwExportNA); return; }
    if (d.written !== undefined) toast(S.pwExportDone.replace("{}", d.path));
  });
};

// Esc, asked for by the pane before it closes: an open editor takes it
// and the half-written entry survives. Anything else is not ours, and
// the pane goes down.
window.__paneEsc = () => {
  if (editing) { escDraft = editing; closeEditor(); return true; }
  return false;
};

// Esc: the way out, decided by the browser because only it knows what
// else is open. Falls back to the page's own history when this file is
// opened outside the browser, where no bridge ever arrives.
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if (editing) { closeEditor(); return; }
    if (bridge && bridge.closePasswords) bridge.closePasswords(KEY);
    else if (typeof qt === "undefined" && history.length > 1) history.back();
  }
  if (e.key === "/" && document.activeElement.tagName !== "INPUT"
      && document.activeElement.tagName !== "TEXTAREA") {
    e.preventDefault();
    document.getElementById("q").focus();
  }
});

function applyStrings() {
  document.title = S.pwManage;
  document.getElementById("t_title").textContent = S.pwManage;
  document.getElementById("q").placeholder = S.pwSearchPh;
  document.getElementById("newbtn").textContent = S.pwNew;
  document.getElementById("importbtn").textContent = S.pwImport;
  document.getElementById("exportbtn").textContent = S.pwExport;
  const sortSel = document.getElementById("sort");
  sortSel.options[0].textContent = S.pwSortName;
  sortSel.options[1].textContent = S.pwSortUsed;
  sortSel.options[2].textContent = S.pwSortChanged;
}

if (typeof qt !== "undefined") {
  new QWebChannel(qt.webChannelTransport, (ch) => {
    bridge = ch.objects.bridge;
    if (bridge.vaultSecret)
      bridge.vaultSecret.connect((ticket, payload) => {
        const then = waiting[ticket];
        delete waiting[ticket];
        if (!then) return;
        let d = {};
        try { d = JSON.parse(payload) || {}; } catch (e) {}
        then(d);
      });
    if (bridge.vaultChanged) bridge.vaultChanged.connect(() => {
      // the store swapping in, a password saved from the toast, the
      // store being switched — none of them may redraw over what he
      // is in the middle of typing
      // A vault that has just been locked redraws over anything,
      // a half-typed editor included: what is on screen has stopped
      // being something he is entitled to look at. Every other reason
      // the vault changed still waits for him to finish, as it did.
      if (editing && bridge.masterState) {
        bridge.masterState((j) => {
          let m = {};
          try { m = JSON.parse(j) || {}; } catch (e) {}
          if (m.locked) { editing = null; refresh(); }
          else pendingRefresh = true;
        });
        return;
      }
      if (editing) { pendingRefresh = true; return; }
      refresh();
    });
    bridge.uiStrings((j) => {
      try { Object.assign(S, JSON.parse(j)); } catch (e) {}
      applyStrings();
      refresh();
    });
  });
} else {
  applyStrings();
  render();
}
</script>
</body>
</html>
