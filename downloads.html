<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Downloads</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000000;
    color: #cdd6f4;
    font-family: "JetBrainsMono Nerd Font", "Cascadia Mono", "Consolas", "Inter", sans-serif;
    padding: 40px 0 60px;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 20px; }
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 26px;
  }
  h1 { font-size: 22px; font-weight: 600; flex: 1; }
  #clear {
    background: rgba(13, 13, 18, 0.9);
    border: 1px solid rgba(243, 139, 168, 0.35);
    border-radius: 12px;
    color: #f38ba8;
    font: inherit;
    font-size: 13px;
    padding: 9px 14px;
    cursor: pointer;
  }
  #clear:hover { background: rgba(243, 139, 168, 0.15); }
  .day {
    color: #6c7086;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin: 22px 0 8px;
  }
  .entry {
    background: rgba(13, 13, 18, 0.6);
    border: 1px solid transparent;
    border-radius: 11px;
    padding: 10px 14px;
    margin-bottom: 5px;
    transition: all .12s;
  }
  .entry:hover { border-color: rgba(137, 180, 250, 0.35); background: rgba(13, 13, 18, 0.95); }
  .entry .top { display: flex; align-items: center; gap: 10px; }
  .entry .name {
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }
  .entry .meta { color: #6c7086; font-size: 12px; margin-top: 4px; }
  .entry .meta .ok { color: #a6e3a1; }
  .entry .meta .bad { color: #f38ba8; }
  .entry button {
    background: transparent;
    border: 1px solid rgba(108, 112, 134, 0.45);
    border-radius: 9px;
    color: #cdd6f4;
    font: inherit;
    font-size: 12px;
    padding: 4px 10px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .entry button:hover { border-color: rgba(137, 180, 250, 0.6); }
  .entry button.danger { color: #f38ba8; border-color: rgba(243, 139, 168, 0.4); }
  .entry button.danger:hover { background: rgba(243, 139, 168, 0.12); }
  .entry button:disabled {
    color: #45475a;
    border-color: rgba(108, 112, 134, 0.2);
    cursor: default;
  }
  .bar {
    height: 5px;
    border-radius: 3px;
    background: rgba(108, 112, 134, 0.25);
    overflow: hidden;
    margin-top: 8px;
  }
  .bar > div { height: 100%; background: #cdd6f4; transition: width .3s linear; }
  .bar.busy > div { width: 30% !important; animation: slide 1.2s linear infinite; }
  @keyframes slide {
    from { margin-left: -30%; }
    to   { margin-left: 100%; }
  }
  #empty { color: #6c7086; margin-top: 40px; text-align: center; }
  /* A selection and a keyboard focus come out of the palette like
     everything else. Left alone they are the engine's own idea of a
     highlight — a blue that belongs to no theme in here, and on a
     couple of them a ring that cannot be seen at all. */
  ::selection { background: #cdd6f4; color: #000000; }
  :focus-visible { outline: 2px solid #cdd6f4; outline-offset: 2px; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1 id="t_downloads">Downloads</h1>
      <button id="clear">Clear finished</button>
    </header>
    <div id="list"></div>
    <div id="empty" hidden>No downloads.</div>
  </div>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script>
  // the browser puts this run's key in our URL; without it the
  // download slots stay shut (a website never learns it)
  const KEY = new URLSearchParams(location.search).get("k") || "";
  let bridge = null, entries = [];
  let STR = {downloads: "Downloads", noDownloads: "No downloads.",
    dlClearAll: "Clear finished", dlOpen: "Open", dlFolder: "Folder",
    dlRemove: "Remove", dlCancel: "Cancel", dlPause: "Pause",
    dlResume: "Resume", dlDone: "Done", dlCancelled: "Cancelled",
    dlFailed: "Failed", dlPaused: "Paused", dlLeft: "left",
    pdfSaving: "Saving as PDF\u2026",
    today: "Today", yesterday: "Yesterday", lang: undefined};
  const speeds = {};  // id -> [lastBytes, lastMs, bytes/s] between polls

  function fmtSize(n) {
    for (const unit of ["B", "KB", "MB", "GB"]) {
      if (n < 1024 || unit === "GB")
        return (unit === "B" ? n.toFixed(0) : n.toFixed(1)) + " " + unit;
      n /= 1024;
    }
  }

  function fmtTime(s) {
    s = Math.round(s);
    if (s < 60) return s + " s";
    if (s < 3600) return Math.floor(s / 60) + " min " + (s % 60) + " s";
    return Math.floor(s / 3600) + " h " + Math.floor(s % 3600 / 60) + " min";
  }

  function dayLabel(t) {
    const d = new Date(t * 1000), now = new Date();
    const midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    if (d >= midnight) return STR.today;
    if (d >= new Date(midnight - 86400000)) return STR.yesterday;
    return d.toLocaleDateString(STR.lang || [],
      { weekday: "long", day: "numeric", month: "long" });
  }

  function speedOf(e) {
    const now = performance.now(), prev = speeds[e.id];
    if (!prev) { speeds[e.id] = [e.received, now, 0]; return 0; }
    const dt = (now - prev[1]) / 1000;
    if (dt < 0.25) return prev[2];
    const instant = (e.received - prev[0]) / dt;
    const speed = prev[2] ? 0.7 * prev[2] + 0.3 * instant : instant;
    speeds[e.id] = [e.received, now, speed];
    return speed;
  }

  function btn(label, cls, onclick, disabled) {
    const b = document.createElement("button");
    b.textContent = label;
    if (cls) b.className = cls;
    b.disabled = !!disabled;
    if (!disabled) b.onclick = onclick;
    return b;
  }

  function metaFor(e) {
    const parts = [];
    // a file the browser is rendering itself: no bytes, no speed
    if (e.state === "active" && e.local) return [STR.pdfSaving, ""];
    if (e.state === "active") {
      parts.push(e.size > 0
        ? fmtSize(e.received) + " / " + fmtSize(e.size)
        : fmtSize(e.received));
      const speed = speedOf(e);
      if (e.paused) parts.push(STR.dlPaused);
      else if (speed > 0) {
        parts.push(fmtSize(speed) + "/s");
        if (e.size > 0)
          parts.push(fmtTime((e.size - e.received) / speed) + " " + STR.dlLeft);
      }
      return [parts.join(" · "), ""];
    }
    if (e.size > 0 || e.received > 0) parts.push(fmtSize(e.size || e.received));
    parts.push(new Date(e.t * 1000).toLocaleTimeString([],
      { hour: "2-digit", minute: "2-digit" }));
    const status = {done: [STR.dlDone, "ok"], cancelled: [STR.dlCancelled, ""],
                    failed: [STR.dlFailed, "bad"]}[e.state] || [e.state, ""];
    return [parts.join(" · ") + " · ", status];
  }

  function render() {
    const list = document.getElementById("list");
    list.innerHTML = "";
    document.getElementById("empty").hidden = entries.length > 0;
    let lastDay = null;
    for (const e of [...entries].reverse()) {
      const label = dayLabel(e.t);
      if (label !== lastDay) {
        const h = document.createElement("div");
        h.className = "day";
        h.textContent = label;
        list.appendChild(h);
        lastDay = label;
      }
      const row = document.createElement("div");
      row.className = "entry";
      row.dataset.id = e.id;
      const top = document.createElement("div");
      top.className = "top";
      const name = document.createElement("span");
      name.className = "name";
      name.textContent = e.name;
      name.title = (e.dir || "") + "/" + e.name;
      top.appendChild(name);
      if (e.state === "active" && e.local) {
        // nothing to offer: a render cannot be paused or cancelled
      } else if (e.state === "active") {
        top.appendChild(e.paused
          ? btn(STR.dlResume, "", () => bridge.resumeDownload(KEY, e.id))
          : btn(STR.dlPause, "", () => bridge.pauseDownload(KEY, e.id)));
        top.appendChild(btn(STR.dlCancel, "danger",
          () => bridge.cancelDownload(KEY, e.id)));
      } else {
        if (e.state === "done") {
          // a file deleted on disk greys out both open actions
          top.appendChild(btn(STR.dlOpen, "",
            () => bridge.openDownload(KEY, e.id), !e.exists));
          top.appendChild(btn(STR.dlFolder, "",
            () => bridge.openDownloadFolder(KEY, e.id), !e.dirExists));
        }
        top.appendChild(btn(STR.dlRemove, "danger", () => {
          bridge.removeDownload(KEY, e.id);
          entries = entries.filter(x => x.id !== e.id);
          render();
        }));
      }
      const meta = document.createElement("div");
      meta.className = "meta";
      const [text, status] = metaFor(e);
      meta.textContent = text;
      if (status) {
        const s = document.createElement("span");
        s.className = status[1];
        s.textContent = status[0];
        meta.appendChild(s);
      }
      row.append(top, meta);
      if (e.state === "active") {
        const bar = document.createElement("div");
        bar.className = "bar" + (e.size > 0 ? "" : " busy");
        const fill = document.createElement("div");
        fill.style.width = e.size > 0
          ? (e.received / e.size * 100).toFixed(1) + "%" : "30%";
        bar.appendChild(fill);
        row.appendChild(bar);
      }
      list.appendChild(row);
    }
  }

  function refresh() {
    if (bridge)
      bridge.getDownloads(KEY, (j) => { entries = JSON.parse(j); render(); });
  }

  // Esc: the way out. The browser decides what that means for this
  // tab — go back, close it, or land on the start page — because only
  // it knows what else is open. The page's own history is the fallback
  // for a downloads.html opened outside the browser, where no bridge
  // ever arrives; before the channel lands, Esc waits rather than
  // guessing.
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (bridge && bridge.closeDownloads) bridge.closeDownloads(KEY);
    else if (typeof qt === "undefined" && history.length > 1) history.back();
  });

  document.getElementById("clear").onclick = () => {
    if (bridge) bridge.clearDownloads(KEY);
    entries = entries.filter(e => e.state === "active");
    render();
  };

  if (typeof qt !== "undefined") {
    new QWebChannel(qt.webChannelTransport, (ch) => {
      bridge = ch.objects.bridge;
      bridge.uiStrings((j) => {
        try {
          Object.assign(STR, JSON.parse(j));
          document.title = STR.downloads;
          document.getElementById("t_downloads").textContent = STR.downloads;
          document.getElementById("clear").textContent = STR.dlClearAll;
          document.getElementById("empty").textContent = STR.noDownloads;
        } catch (e) {}
        refresh();
      });
      // push on start/finish; a light poll keeps running bars moving
      bridge.downloadsChanged.connect(refresh);
      setInterval(() => {
        if (entries.some(e => e.state === "active")) refresh();
      }, 600);
    });
  } else {
    render();
  }
</script>
</body>
</html>
